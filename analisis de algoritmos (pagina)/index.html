<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador de Algoritmos de Ordenamiento</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Visualizador de Algoritmos de Ordenamiento</h1>
  </header>

  <main class="container">
    <section class="controls-panel">
      <div class="control-group">
        <label for="algorithm-select">Algoritmo:</label>
        <select id="algorithm-select">
          <option value="selection">Selection Sort</option>
          <option value="bubble">Bubble Sort</option>
          <option value="exchange">Exchange Sort</option>
          <option value="gnome">Gnome Sort</option>
          <option value="insertion">Insertion Sort</option>
          <option value="stooge">Stooge Sort</option>
          <option value="merge">Merge Sort</option>
          <option value="quick">Quick Sort</option>
        </select>
      </div>

      <div class="control-group">
        <label for="array-size">Cantidad (n): <span id="size-value">30</span></label>
        <input type="range" id="array-size" min="10" max="100" value="30">
      </div>

      <div class="control-group">
        <label for="speed">Velocidad:</label>
        <input type="range" id="speed" min="1" max="100" value="50">
      </div>

      <div class="button-group">
        <button id="btn-generate" class="btn">Generar Arreglo</button>
        <button id="btn-start" class="btn btn-primary">▶ Iniciar</button>
        <button id="btn-reset" class="btn btn-danger">🔄 Reiniciar</button>
      </div>
    </section>

    <section class="visualizer-container" id="visualizer"></section>

    <section class="metrics-panel">
      <div class="metric-card">
        <h3>Comparaciones</h3>
        <p id="metric-comparisons">0</p>
      </div>
      <div class="metric-card">
        <h3>Intercambios (Swaps)</h3>
        <p id="metric-swaps">0</p>
      </div>
      <div class="metric-card">
        <h3>Tiempo</h3>
        <p id="metric-time">0 ms</p>
      </div>
      <div class="metric-card">
        <h3>Complejidad Teórica</h3>
        <p id="metric-complexity">O(n²)</p>
      </div>
    </section>
  </main>

  <script src="js/algorithms.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
